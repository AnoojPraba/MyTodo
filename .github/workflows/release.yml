#
# Builds MyTodo for Windows (MyTodo.exe) and Mac (MyTodo.app) on GitHub's own
# machines, running all tests on both.
#   - Push a version tag (e.g. v1.3.2): both zips are attached to a DRAFT release.
#     Open Releases on GitHub, add the description and click Publish.
#   - Actions tab -> "Build release" -> Run workflow: builds only, zips appear as
#     downloadable artifacts on the run page (no release is created).
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14  # Apple Silicon
            label: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test and build
        run: python build_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: MyTodo-${{ matrix.label }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release with both zips
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" --draft --title "MyTodo $TAG" \
            --notes "Draft created by GitHub Actions. Replace this text with the release description, then click Publish."
