<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTodo stopped</title>
<style>
  :root { --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6ea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --panel: #1d2128; --text: #e5e7eb; --muted: #9aa1ad; --line: #2e333c; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
    color: var(--text); font: 15px/1.6 "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 2rem 2.25rem;
    max-width: 440px; text-align: center; }
  h1 { font-size: 1.35rem; margin: .75rem 0 .5rem; }
  p { color: var(--muted); margin: .4rem 0; }
  svg { width: 56px; height: 56px; }
</style>
</head>
<body>
  <div class="box">
    <svg viewBox="0 0 256 256" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4263eb"/><stop offset="1" stop-color="#7048e8"/></linearGradient></defs>
      <rect width="256" height="256" rx="58" fill="url(#g)" opacity=".55"/>
    </svg>
    <h1>MyTodo has stopped</h1>
    <p>Your work is saved. You can close this tab.</p>
    <p>To start MyTodo again, double-click <b>MyTodo.exe</b>.</p>
  </div>
</body>
</html>
