<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyTodo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}"><img src="{{ url_for('static', filename='icon.svg') }}" alt="" width="28" height="28"> MyTodo</a>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Dashboard</a>
    <a href="{{ url_for('closed') }}" class="{{ 'active' if request.endpoint == 'closed' }}">Closed</a>
    <a href="{{ url_for('report') }}" class="{{ 'active' if request.endpoint == 'report' }}">Report</a>
    <a href="{{ url_for('review_page') }}" class="{{ 'active' if request.endpoint in ('review_page', 'review_saved') }}">Review</a>
    <a href="{{ url_for('backup_page') }}" class="{{ 'active' if request.endpoint == 'backup_page' }}">Backup</a>
    <a href="{{ url_for('task_new') }}" class="btn primary">+ New task</a>
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
